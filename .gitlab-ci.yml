# Equivalente GitLab do workflow .github/workflows/update-painel.yml
# Extrai do Jira, compila o painel e publica no GitLab Pages (job "pages").
# Variáveis necessárias (Settings > CI/CD > Variables, mascaradas): JIRA_EMAIL, JIRA_TOKEN
# Roda por agendamento (Build > Pipeline schedules: "0 8 * * 1-5", fuso America/Sao_Paulo)
# ou manualmente (Build > Pipelines > Run pipeline). Não roda a cada push, como no GitHub.

pages:
  image: node:18
  stage: deploy
  tags:
    - dind
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - node extract/run.js
    - node build.js
    - mkdir -p public
    - cp dist/SDPREJ_Painel.html public/index.html
    - echo "User-agent:*" > public/robots.txt
    - echo "Disallow:/" >> public/robots.txt
  artifacts:
    paths:
      - public
      - data        # JSONs extraídos: o job "confluence" reaproveita, sem consultar o Jira de novo
    expire_in: never

# Atualiza a página do Confluence com os números do dia e anexa o painel completo.
#   1. gera o corpo da página a partir dos mesmos JSONs do painel
#   2. valida o XHTML (o Confluence recusa com 400 se estiver inválido)
#   3. publica o corpo da página
#   4. anexa o HTML (nova versão do mesmo anexo) e garante o link no topo
# allow_failure: se o Confluence recusar (IP/permissão), o painel já gerado não é afetado.
confluence:
  image: node:18
  stage: .post
  needs: [pages]
  allow_failure: true
  tags:
    - dind
  variables:
    TZ: America/Sao_Paulo
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - node generate-confluence-premium.js
    - node valida-xhtml.js confluence-content.html
    - node publish-confluence.js
    - node publish-confluence-ci.js public/index.html

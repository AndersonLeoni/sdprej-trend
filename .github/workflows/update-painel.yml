name: 📊 Atualizar Painel SDPREJ

on:
  schedule:
    # Roda de segunda a sexta às 8:00 da manhã (UTC-3 = 11:00 UTC)
    # Formato cron: minuto hora dia-mês mês dia-semana
    # 1-5 = seg-sex
    - cron: '0 11 * * 1-5'
  # Também permite rodar manualmente
  workflow_dispatch:

# Só os dois escopos que o job realmente usa: contents (push na gh-pages) e
# pages (publicação). Nada de id-token ou outros escopos por padrão.
permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: 📥 Clonar repositório
        uses: actions/checkout@v3

      # 2. Instala Node.js
      - name: 📦 Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      # 3. Extrai dados do Jira
      - name: 🔄 Extrair dados do Jira
        run: node extract/run.js
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

      # 4. Compila o painel
      - name: 🔨 Compilar painel
        run: node build.js

      # 5. Copia painel pra pasta do GitHub Pages
      - name: 📁 Preparar para GitHub Pages
        run: |
          mkdir -p gh-pages
          cp dist/SDPREJ_Painel.html gh-pages/index.html
          printf 'User-agent: *\nDisallow: /\n' > gh-pages/robots.txt
          echo "✅ Painel pronto para publicar"

      # 6. Faz upload pra branch gh-pages
      - name: 🚀 Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages

      # 7. Notificação final
      - name: ✅ Concluído
        run: |
          echo "✨ Painel atualizado com sucesso!"
          echo "🌐 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
